<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
    }

    .box {
        width: 90%;
        max-width: 420px;
        padding: 30px 20px;
        text-align: center;
        background: rgba(255,255,255,0.92);
        border-radius: 25px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        position: relative;
        z-index: 10;
    }

    h1 {
        color: #ff4f81;
    }

    input {
        width: 85%;
        padding: 13px;
        border: 2px solid #ff8fab;
        border-radius: 20px;
        text-align: center;
        font-size: 16px;
        outline: none;
    }

    button {
        margin-top: 15px;
        padding: 12px 30px;
        border: none;
        border-radius: 25px;
        background: #ff4f81;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #ff2f68;
    }

    #surprise {
        display: none;
    }

    #surprise img {
        width: 100%;
        max-height: 350px;
        object-fit: cover;
        border-radius: 20px;
        margin: 15px 0;
    }

    .message {
        color: #ff477e;
        font-size: 24px;
        font-weight: bold;
        line-height: 1.6;
    }

    .heart {
        position: fixed;
        bottom: -30px;
        font-size: 25px;
        animation: fly 5s linear forwards;
        z-index: 1;
        pointer-events: none;
    }

    @keyframes fly {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        100% {
            transform: translateY(-110vh) rotate(360deg) scale(1.5);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="box">

    <div id="login">
        <h1>💌 A Little Surprise 💌</h1>
        <p>ဒီထဲမှာ ဝင်ဖို့ password လေးထည့်ပါ ❤️</p>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <br>

        <button onclick="checkPassword()">
            ဝင်မယ် ❤️
        </button>

        <p id="error"></p>
    </div>


    <div id="surprise">

        <h1>❤️ For You ❤️</h1>

        <!-- ဒီနေရာမှာ ကိုတို့ပုံပေါ်မယ် -->
        <img src="IMG_20260901_163419_746.jpg" alt="Our Photo">

        <div class="message">
            ချစ်တယ်နော် ❤️<br>
            မင်းအတွက် အမြဲတမ်း အမှတ်တရလေးဖြစ်နေပါစေ 💕
        </div>

        <p>
            You are special to me. ❤️
        </p>

    </div>

</div>


<script>

function checkPassword() {

    const password =
        document.getElementById("password").value;

    if (password === "9102025") {

        document.getElementById("login").style.display = "none";

        document.getElementById("surprise").style.display = "block";

        // အသည်းတွေ စပျံမယ်
        setInterval(createHeart, 300);

    } else {

        document.getElementById("error").innerHTML =
            "Password မမှန်သေးဘူးနော် 😝❤️";

        document.getElementById("error").style.color = "red";
    }
}


function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = ["❤️", "💗", "💕", "💖", "💘"];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}

</script>

</body>
</html>
